[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "chess-tui"
version = "0.1.0"
description = "Highly customizable Chess.com terminal client with Vimium-style move hints and multi-account browser bridge"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Rutytoi220", email = "charlesblemontmoyen@proton.me" },
]
keywords = ["chess", "chess.com", "tui", "terminal", "vimium", "textual"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment :: Board Games",
]
dependencies = [
    "textual>=1.0.0",
    "python-chess>=1.10.0",
    "httpx>=0.27.0",
    "websockets>=13.0",
    "tomli-w>=1.0.0",
    "platformdirs>=4.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

[project.scripts]
chess-tui = "chess_tui.__main__:main"
chesscom-tui = "chess_tui.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/chess_tui"]

[tool.hatch.build.targets.wheel.force-include]
"extension" = "chess_tui/extension"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "RUF"]
ignore = ["E501", "RUF012"]
