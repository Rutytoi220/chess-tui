<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { font-family: system-ui, sans-serif; width: 260px; padding: 12px; background: #1e1e1b; color: #f1efea; }
    h3 { margin: 0 0 8px 0; color: #81b64c; font-size: 15px; }
    label { display: block; font-size: 12px; margin-top: 8px; color: #bbb; }
    input[type="text"] { width: 100%; box-sizing: border-box; padding: 6px; margin-top: 4px; background: #2b2926; color: #fff; border: 1px solid #4e7837; border-radius: 4px; }
    .row { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }
    button { background: #81b64c; color: #111; border: none; padding: 6px 12px; border-radius: 4px; font-weight: bold; cursor: pointer; }
    .status { margin-top: 8px; font-size: 12px; padding: 6px; background: #2b2926; border-radius: 4px; }
  </style>
</head>
<body>
  <h3>chess-tui Bridge</h3>
  <div id="status" class="status">Checking connection...</div>
  <label>TUI WebSocket URL</label>
  <input id="wsUrl" type="text" value="ws://127.0.0.1:8765" />
  <div class="row">
    <label style="margin:0"><input id="enabled" type="checkbox" checked /> Enabled</label>
    <button id="save">Save</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
